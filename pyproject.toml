[project]
name = "foot-cv"
version = "0.1.0"
description = "Football computer vision: video -> tracking data -> tactical analysis"
requires-python = ">=3.11"
dependencies = [
    "gdown>=6.4.2",
    "ipykernel>=7.4.0",
    "lap>=0.5.13",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "opencv-python>=5.0.0.93",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "scikit-learn>=1.9.1",
    "supervision>=0.31.1",
    "ultralytics>=8.4.183",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foot_cv"]
